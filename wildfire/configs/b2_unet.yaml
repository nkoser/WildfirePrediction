# B2: raeumliche Baseline. Ein U-Net ueber 33x33-Patches mit fuenf
# gestapelten Zeitscheiben. Verlust und Auswertung am Zentrumspixel,
# damit der Vergleich mit B0 und B1 direkt ist.
run_id: b2_unet_temporal
split: temporal
patch: 33
lookback: 30
cooldown: 7
n_slices: 5
horizon: 100
width: 48
init_bias: null      # null = init_hazard_logit(): F(H) startet bei der Praevalenz;
                      # frueher -7, das war ein Tages-Hazard von 9e-4 (F(100) = 8,7 %)

batch_size: 64
epochs: 8
lr: 0.001
weight_decay: 0.0001
workers: 24           # Engpass ist das Lesen, nicht die GPU; der Job
                      # fordert 32 CPUs an, Rest fuer Haupt- und Systemprozess
amp: false            # erst nach numerischem Vergleich mit FP32 einschalten
seed: 20260827

# Blockweises Mischen statt globalem. Gemessen je Prozess auf dem Wuerfel:
# zufaellig 42,5 Beispiele/s, chunked 220,8 - Faktor 5,2. Ein Block von 20 000
# Landmarks umspannt rund 30 Kalendertage, die Durchmischung bleibt also
# brauchbar. 0 schaltet auf globales Mischen zurueck.
shuffle_chunk: 20000

# Begrenzung je Epoche. Nicht der volle Trainingssatz: bei rund 9 Mio.
# nutzbaren Landmarks und etwa 2000 Samples/s waere eine Epoche ueber eine
# Stunde lang. 1,5 Mio. je Epoche kosten rund 12 Minuten und sehen ueber
# acht Epochen trotzdem den groessten Teil der Daten - bei jeweils neu
# gezogener Teilmenge waere es der ganze Satz.
limit_train: 1500000
limit_val: 300000

early_stopping:
  metric: nll         # vorab festgelegt, nicht nachtraeglich gewaehlt
  patience: 3
